<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercado House Ledger</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24493A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#1C2B24; --leaf:#24493A; --leaf-deep:#1A3629; --paper:#F3F5F0; --card:#fff;
  --line:#DDE4DC; --soft:#EEF2ED; --muted:#5F6E66; --mango:#E9B03A; --out:#A8432F; --in:#2E7D4F;
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper)}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.num,td.r{font-variant-numeric:tabular-nums}
button{font:inherit}
.app{display:flex;min-height:100vh}

/* Sidebar */
.side{width:250px;flex-shrink:0;background:var(--leaf);color:#E4EDE6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 14px}
.brand h1{font-size:21px;margin:0;line-height:1.15;color:#fff;font-weight:700}
.brand small{color:#A9C2B3;font-size:12.5px}
.nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#D6E3DA;font-size:14.5px;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--paper);color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.nav .sep{height:1px;background:rgba(255,255,255,.13);margin:8px 12px}
.cashbox{margin:8px 12px;padding:14px 16px;border-radius:10px;background:var(--leaf-deep)}
.cashbox span{font-size:12.5px;color:#A9C2B3}
.cashbox b{display:block;font-size:25px;color:var(--mango);font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.cashbox b.neg{color:#F19A86}
.who{padding:10px 20px 18px;font-size:13px;color:#A9C2B3}
.who strong{color:#fff;font-weight:600;display:block}
.who .links{display:flex;gap:14px;margin-top:6px}
.linkbtn{background:none;border:0;padding:0;color:#CFE0D5;text-decoration:underline;cursor:pointer;font-size:13px}

/* Main */
.main{flex:1;min-width:0;padding:28px 34px 70px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h2{font-size:30px;margin:0;font-weight:700;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted)}
.btn{font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.primary:hover{background:#1E3F31}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--out);border-color:#E9CBC3}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--mango);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:22px;margin-top:4px;font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.stat.hero{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stat.hero span{color:#BFD3C6}
.stat.hero b{font-size:30px;color:var(--mango)}
.out{color:var(--out)} .in{color:var(--in)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.panel h3{margin:0;font-size:17px;padding:14px 16px;border-bottom:1px solid var(--line)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .grow{flex:1}
select,input,textarea{font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid #CCD6CD;border-radius:7px;background:#fff;color:var(--ink);width:100%}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 14px;background:#FAFBF8;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--soft);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
td.act .btn{margin-left:6px}
tfoot td{font-weight:700;background:#FAFBF8;border-bottom:0}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);white-space:nowrap}
.tag.unpaid{background:#F8E4DF;color:var(--out)}
.tag.paid{background:#E1F0E6;color:var(--in)}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.banner{background:#FFF4D9;border:1px solid #F0D58C;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13.5px}
.err{color:var(--out);font-size:13.5px;margin:0}
.bars{padding:8px 16px 14px}
.bar{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center;padding:7px 0;background:none;border:0;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.bar .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,32,26,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:12px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 14px;font-size:20px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13.5px;font-weight:500}
.req{color:var(--out)}
.hint{color:var(--muted);font-weight:400;font-size:12.5px}
.calc{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--leaf)}
.login .card{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
.login h1{margin:0;font-size:26px}
.login p{color:var(--muted);margin:6px 0 20px}

.mobilebar{display:none}
.scrim{display:none}
@media(max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
  .mobilebar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--leaf);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .mobilebar .menu{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;font-size:18px;line-height:1;cursor:pointer}
  .mobilebar b{flex:1;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
  .mobilebar .num{color:var(--mango);font-weight:700}
  .main{padding:18px 14px 70px}
  .top h2{font-size:24px}
  .toolbar select,.toolbar input{flex:1;min-width:0}
  table.resp thead{display:none}
  table.resp tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  table.resp td{display:flex;justify-content:space-between;gap:14px;border:0;padding:4px 14px;text-align:right}
  table.resp td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left;flex-shrink:0}
  table.resp td.act{justify-content:flex-end}
  table.resp td.act::before{content:none}
  table.resp tfoot td:empty{display:none}
  .bar{grid-template-columns:110px 1fr 96px;font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

/* ============ SETTINGS — paste your Supabase anon key here ============ */
const SUPABASE_URL = "https://csqwfplliluulkvqhtcp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcXdmcGxsaWx1dWxrdnFodGNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5ODE1ODMsImV4cCI6MjEwNjU1NzU4M30.N893t50gHq-9K7R2V2DJZEw1DKKukV0TEk8Kwe3hb8U";
/* ===================================================================== */

const CLOUD = !!SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith("PASTE") && !!window.supabase;
const sb = CLOUD ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const T = { users: "mh_users", entries: "mh_entries", history: "mh_history" };

const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2);
const lsGet = k => { try { return JSON.parse(localStorage.getItem("mhl_" + k) || "[]"); } catch (e) { return []; } };
const lsSet = (k, v) => { try { localStorage.setItem("mhl_" + k, JSON.stringify(v)); } catch (e) {} };

const db = {
  async list(t) {
    if (sb) {
      let all = [], from = 0;
      while (true) {
        const { data, error } = await sb.from(t).select("*").range(from, from + 999);
        if (error) throw error;
        all = all.concat(data || []);
        if (!data || data.length < 1000) break;
        from += 1000;
      }
      return all;
    }
    return lsGet(t);
  },
  async insert(t, row) {
    const r = { id: uid(), created_at: new Date().toISOString(), ...row };
    if (sb) { const { data, error } = await sb.from(t).insert(r).select().single(); if (error) throw error; return data; }
    lsSet(t, [...lsGet(t), r]); return r;
  },
  async update(t, id, patch) {
    if (sb) { const { data, error } = await sb.from(t).update(patch).eq("id", id).select().single(); if (error) throw error; return data; }
    let out; lsSet(t, lsGet(t).map(x => x.id === id ? (out = { ...x, ...patch }) : x)); return out;
  },
  async remove(t, id) {
    if (sb) { const { error } = await sb.from(t).delete().eq("id", id); if (error) throw error; return; }
    lsSet(t, lsGet(t).filter(x => x.id !== id));
  }
};

async function hashPw(username, pw) {
  const data = new TextEncoder().encode("mhl|" + username.trim().toLowerCase() + "|" + pw);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ---------- formatting ---------- */
const num = v => Number(v) || 0;
const peso = n => (num(n) < 0 ? "−₱" : "₱") + Math.abs(num(n)).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" }) : "—";
const fmtMonth = m => m ? new Date(m + "-01T00:00:00").toLocaleDateString("en-PH", { month: "long", year: "numeric" }) : "—";
const fmtWhen = s => s ? new Date(s).toLocaleString("en-PH", { dateStyle: "medium", timeStyle: "short" }) : "—";
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const sum = (arr, f) => arr.reduce((a, e) => a + f(e), 0);
const ROLES = { admin: "Admin", editor: "View and edit", viewer: "View only" };

/* ---------- sections ---------- */
const CATS = {
  edwin:       { label: "Edwin – Grass Cutting", color: "#7FB069", kind: "labor", person: "Edwin", blurb: "Weekly grass cutting by Edwin.", descLabel: "Work done", descDefault: "Weekly grass cutting" },
  bombet:      { label: "Bombet – Caretaker", color: "#5BA4B4", kind: "labor", person: "Bombet", blurb: "Caretaker salary and payouts for Bombet.", descLabel: "Pay period / work", descDefault: "Caretaker salary" },
  maintenance: { label: "Maintenance", color: "#C98B4B", kind: "maint", blurb: "Repairs, supplies, cleaning and any other upkeep." },
  pelco:       { label: "PELCO Bill", color: "#E9B03A", kind: "bill", unit: "kWh", blurb: "Monthly electricity bill." },
  bwsi:        { label: "BWSI Bill", color: "#4F86C6", kind: "bill", unit: "cu.m", blurb: "Monthly water bill." },
  received:    { label: "Cash Received", color: "#2E7D4F", kind: "received", blurb: "Funds received from the house owner." },
  advance:     { label: "Cash Advance", color: "#A8432F", kind: "advance", blurb: "Cash advances given to Edwin and Bombet, deducted from their pay." },
};
const ORDER = ["edwin", "bombet", "maintenance", "pelco", "bwsi", "received", "advance"];

function fieldsFor(cat) {
  const c = CATS[cat];
  switch (c.kind) {
    case "labor": return [
      { k: "entry_date", l: "Date paid", t: "date", req: true },
      { k: "description", l: c.descLabel, t: "text", def: c.descDefault },
      { k: "amount", l: "Gross amount", t: "money", req: true },
      { k: "ca_deducted", l: "Less cash advance", t: "money" },
      { k: "remarks", l: "Remarks", t: "textarea" }];
    case "maint": return [
      { k: "entry_date", l: "Date", t: "date", req: true },
      { k: "description", l: "Item or work done", t: "text", req: true },
      { k: "person", l: "Supplier or worker", t: "text" },
      { k: "amount", l: "Amount", t: "money", req: true },
      { k: "or_number", l: "Receipt / O.R. no.", t: "text" },
      { k: "remarks", l: "Remarks", t: "textarea" }];
    case "bill": return [
      { k: "billing_month", l: "Billing month", t: "month", req: true },
      { k: "due_date", l: "Due date", t: "date" },
      { k: "reading", l: `Consumption (${c.unit})`, t: "number" },
      { k: "amount", l: "Amount due", t: "money", req: true },
      { k: "convenience_fee", l: "Convenience fee", t: "money" },
      { k: "entry_date", l: "Date paid", t: "date", hint: "Leave blank if not yet paid" },
      { k: "or_number", l: "O.R. number", t: "text" },
      { k: "remarks", l: "Remarks", t: "textarea" }];
    case "received": return [
      { k: "entry_date", l: "Date received", t: "date", req: true },
      { k: "amount", l: "Amount", t: "money", req: true },
      { k: "mode", l: "Mode", t: "select", opts: ["Cash", "Bank transfer", "GCash", "Check", "Other"], def: "Cash" },
      { k: "reference", l: "Reference no.", t: "text" },
      { k: "person", l: "Received by", t: "text" },
      { k: "remarks", l: "Remarks", t: "textarea" }];
    case "advance": return [
      { k: "entry_date", l: "Date given", t: "date", req: true },
      { k: "person", l: "Given to", t: "select", opts: ["Edwin", "Bombet"], def: "Edwin", req: true },
      { k: "amount", l: "Amount", t: "money", req: true },
      { k: "description", l: "Purpose", t: "text" },
      { k: "remarks", l: "Remarks", t: "textarea" }];
  }
  return [];
}

const monthOf = e => CATS[e.category]?.kind === "bill" ? (e.billing_month || (e.entry_date || "").slice(0, 7)) : (e.entry_date || "").slice(0, 7);
const gross = e => num(e.amount) + num(e.convenience_fee);
function cashOut(e) {
  const k = CATS[e.category]?.kind;
  if (k === "labor") return num(e.amount) - num(e.ca_deducted);
  if (k === "bill") return e.entry_date ? gross(e) : 0;
  if (k === "received") return 0;
  return num(e.amount);
}
const cashIn = e => e.category === "received" ? num(e.amount) : 0;
function outstandingOf(person, entries) {
  const given = sum(entries.filter(e => e.category === "advance" && e.person === person), e => num(e.amount));
  const deducted = sum(entries.filter(e => e.category === person.toLowerCase()), e => num(e.ca_deducted));
  return given - deducted;
}
function summaryOf(e) {
  const k = CATS[e.category]?.kind;
  if (k === "bill") return `${CATS[e.category].label} for ${fmtMonth(e.billing_month)}${e.entry_date ? " (paid)" : " (unpaid)"}`;
  if (k === "received") return `Fund from owner via ${e.mode || "cash"}${e.reference ? " – ref " + e.reference : ""}`;
  if (k === "advance") return `${e.person}${e.description ? " – " + e.description : ""}`;
  if (k === "labor") return `${e.description || CATS[e.category].label}${num(e.ca_deducted) ? `, less CA ${peso(e.ca_deducted)}` : ""}`;
  return e.description || "";
}
function fmtVal(f, v) {
  if (v === null || v === undefined || v === "") return "—";
  if (f.t === "money") return peso(v);
  if (f.t === "date") return fmtDate(v);
  if (f.t === "month") return fmtMonth(v);
  return String(v);
}
function same(f, a, b) {
  if (f.t === "money" || f.t === "number") {
    const ea = a === "" || a == null, eb = b === "" || b == null;
    if (ea && eb) return true;
    if (f.k === "ca_deducted" || f.k === "convenience_fee") return num(a) === num(b);
    if (ea !== eb) return false;
    return num(a) === num(b);
  }
  return String(a ?? "") === String(b ?? "");
}
function buildRow(cat, v) {
  const row = { category: cat };
  fieldsFor(cat).forEach(f => {
    const x = v[f.k];
    if (f.t === "money" || f.t === "number") row[f.k] = (x === "" || x == null) ? (f.k === "ca_deducted" || f.k === "convenience_fee" ? 0 : null) : num(x);
    else if (f.t === "date" || f.t === "month") row[f.k] = x || null;
    else row[f.k] = (x ?? "").toString().trim() || null;
  });
  if (CATS[cat].kind === "labor") row.person = CATS[cat].person;
  return row;
}
function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- shared UI ---------- */
function Modal({ title, children, onClose }) {
  useEffect(() => {
    const k = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [onClose]);
  return (
    <div className="modal-bg" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={title}>
        <h3>{title}</h3>{children}
      </div>
    </div>
  );
}
function Field({ f, value, onChange }) {
  const common = { value: value ?? "", onChange: e => onChange(e.target.value) };
  let input;
  if (f.t === "textarea") input = <textarea rows={2} {...common} />;
  else if (f.t === "select") input = <select {...common}>{f.opts.map(o => <option key={o}>{o}</option>)}</select>;
  else input = <input type={f.t === "money" || f.t === "number" ? "number" : f.t}
    step={f.t === "money" ? "0.01" : "any"} min={f.t === "money" ? "0" : undefined}
    inputMode={f.t === "money" || f.t === "number" ? "decimal" : undefined} {...common} />;
  return <label>{f.l}{f.req && <span className="req"> *</span>}{input}{f.hint && <span className="hint">{f.hint}</span>}</label>;
}

/* ---------- entry form ---------- */
function EntryForm({ cat, entry, outstanding, onClose, onSave }) {
  const c = CATS[cat]; const fs = fieldsFor(cat);
  const [v, setV] = useState(() => {
    const o = {};
    fs.forEach(f => {
      o[f.k] = entry ? (entry[f.k] ?? "") :
        (f.def ?? (f.t === "date" && f.req ? today() : f.t === "month" ? today().slice(0, 7) : ""));
    });
    return o;
  });
  const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const set = (k, x) => setV(p => ({ ...p, [k]: x }));
  const allowed = c.kind === "labor" ? outstanding + (entry ? num(entry.ca_deducted) : 0) : 0;

  const save = async () => {
    for (const f of fs) if (f.req && (v[f.k] === "" || v[f.k] == null)) return setErr(`${f.l} is required.`);
    if (fs.some(f => f.t === "money" && num(v[f.k]) < 0)) return setErr("Amounts can't be negative.");
    if (c.kind === "labor") {
      if (num(v.ca_deducted) > num(v.amount)) return setErr("Cash advance deduction can't be more than the gross amount.");
      if (num(v.ca_deducted) > allowed + 0.001) return setErr(`${c.person}'s outstanding cash advance is only ${peso(allowed)}.`);
    }
    setBusy(true);
    try { await onSave(buildRow(cat, v), entry); onClose(); }
    catch (e) { setErr("Save failed: " + e.message); setBusy(false); }
  };

  return (
    <Modal title={(entry ? "Edit " : "Add ") + c.label} onClose={onClose}>
      <div className="form">
        {fs.map(f => (
          <div key={f.k}>
            <Field f={f} value={v[f.k]} onChange={x => set(f.k, x)} />
            {f.k === "ca_deducted" && <span className="hint">Outstanding cash advance: {peso(allowed)}</span>}
          </div>
        ))}
        {c.kind === "labor" && <div className="calc"><span>Net cash paid</span><b className="num">{peso(num(v.amount) - num(v.ca_deducted))}</b></div>}
        {err && <p className="err" role="alert">{err}</p>}
        <div className="actions">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn primary" disabled={busy} onClick={save}>{busy ? "Saving…" : (entry ? "Save changes" : "Add entry")}</button>
        </div>
      </div>
    </Modal>
  );
}

/* ---------- section view ---------- */
function columns(cat) {
  const c = CATS[cat];
  const desc = e => <div>{e.description || "—"}{e.remarks && <div className="sub">{e.remarks}</div>}</div>;
  switch (c.kind) {
    case "labor": return [
      { h: "Date paid", cell: e => fmtDate(e.entry_date) },
      { h: c.descLabel, cell: desc },
      { h: "Gross", r: 1, cell: e => peso(e.amount), tot: e => num(e.amount) },
      { h: "Less CA", r: 1, cell: e => num(e.ca_deducted) ? peso(e.ca_deducted) : "—", tot: e => num(e.ca_deducted) },
      { h: "Net paid", r: 1, cell: e => <b>{peso(cashOut(e))}</b>, tot: cashOut }];
    case "maint": return [
      { h: "Date", cell: e => fmtDate(e.entry_date) },
      { h: "Item or work", cell: desc },
      { h: "Supplier / worker", cell: e => e.person || "—" },
      { h: "Receipt no.", cell: e => e.or_number || "—" },
      { h: "Amount", r: 1, cell: e => <b>{peso(e.amount)}</b>, tot: e => num(e.amount) }];
    case "bill": return [
      { h: "Billing month", cell: e => <div>{fmtMonth(e.billing_month)}{e.remarks && <div className="sub">{e.remarks}</div>}</div> },
      { h: "Due date", cell: e => fmtDate(e.due_date) },
      { h: c.unit, r: 1, cell: e => e.reading != null && e.reading !== "" ? num(e.reading).toLocaleString("en-PH") : "—", tot: e => num(e.reading), raw: 1 },
      { h: "Status", cell: e => e.entry_date ? <span className="tag paid">Paid {fmtDate(e.entry_date)}</span> : <span className="tag unpaid">Unpaid</span> },
      { h: "O.R. no.", cell: e => e.or_number || "—" },
      { h: "Amount due", r: 1, cell: e => peso(e.amount), tot: e => num(e.amount) },
      { h: "Conv. fee", r: 1, cell: e => num(e.convenience_fee) ? peso(e.convenience_fee) : "—", tot: e => num(e.convenience_fee) },
      { h: "Total", r: 1, cell: e => <b>{peso(gross(e))}</b>, tot: gross }];
    case "received": return [
      { h: "Date", cell: e => fmtDate(e.entry_date) },
      { h: "Mode", cell: e => <div>{e.mode || "—"}{e.remarks && <div className="sub">{e.remarks}</div>}</div> },
      { h: "Reference", cell: e => e.reference || "—" },
      { h: "Received by", cell: e => e.person || "—" },
      { h: "Amount", r: 1, cell: e => <b className="in">{peso(e.amount)}</b>, tot: e => num(e.amount) }];
    case "advance": return [
      { h: "Date given", cell: e => fmtDate(e.entry_date) },
      { h: "Given to", cell: e => <span className="tag">{e.person}</span> },
      { h: "Purpose", cell: desc },
      { h: "Amount", r: 1, cell: e => <b>{peso(e.amount)}</b>, tot: e => num(e.amount) }];
  }
  return [];
}

function SectionView({ cat, entries, me, onSave, onDelete }) {
  const c = CATS[cat];
  const rows = entries.filter(e => e.category === cat);
  const months = [...new Set(rows.map(monthOf).filter(Boolean))].sort().reverse();
  const [month, setMonth] = useState("all");
  const [who, setWho] = useState("all");
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(null);
  const canEdit = me.role !== "viewer", canDelete = me.role === "admin";

  const sortKey = e => `${c.kind === "bill" ? e.billing_month || "" : e.entry_date || ""}|${e.created_at || ""}`;
  const shown = rows
    .filter(e => month === "all" || monthOf(e) === month)
    .filter(e => who === "all" || e.person === who)
    .filter(e => !q || [e.description, e.person, e.remarks, e.or_number, e.reference, e.mode].join(" ").toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
  const cols = columns(cat);
  const outE = outstandingOf("Edwin", entries), outB = outstandingOf("Bombet", entries);
  const amt = sum(shown, e => num(e.amount));

  let stats;
  if (c.kind === "labor") {
    const out = c.person === "Edwin" ? outE : outB;
    stats = [["Gross amount", peso(amt)], ["Net cash paid", peso(sum(shown, cashOut))], ["Cash advance deducted", peso(sum(shown, e => num(e.ca_deducted)))], [`${c.person}'s outstanding CA`, peso(out), out > 0 ? "out" : ""]];
  } else if (c.kind === "bill") {
    const unpaid = shown.filter(e => !e.entry_date);
    stats = [["Total billed (incl. fees)", peso(sum(shown, gross))], ["Convenience fees", peso(sum(shown, e => num(e.convenience_fee)))], ["Paid", peso(sum(shown, e => e.entry_date ? gross(e) : 0))], ["Unpaid", `${peso(sum(unpaid, gross))}`, unpaid.length ? "out" : ""]];
  } else if (c.kind === "received") {
    stats = [["Total received", peso(amt), "in"], ["Entries", shown.length]];
  } else if (c.kind === "advance") {
    stats = [["Advances given", peso(amt)], ["Edwin outstanding", peso(outE), outE > 0 ? "out" : ""], ["Bombet outstanding", peso(outB), outB > 0 ? "out" : ""]];
  } else {
    stats = [["Total spent", peso(amt)], ["Entries", shown.length]];
  }

  const exportCsv = () => {
    const fs = fieldsFor(cat);
    downloadCSV(`${cat}-${month}.csv`, [fs.map(f => f.l).concat(c.kind === "labor" ? ["Net paid"] : [], ["Added by"]),
      ...shown.map(e => fs.map(f => e[f.k] ?? "").concat(c.kind === "labor" ? [cashOut(e)] : [], [e.created_by || ""]))]);
  };
  const del = async e => {
    if (!window.confirm(`Delete this ${c.label} entry (${peso(e.amount)})? This can't be undone.`)) return;
    try { await onDelete(e); } catch (x) { alert("Delete failed: " + x.message); }
  };

  return (
    <>
      <div className="top">
        <div><h2>{c.label}</h2><p>{c.blurb}</p></div>
        {canEdit && <button className="btn primary" onClick={() => setEditing("new")}>+ Add entry</button>}
      </div>
      <div className="stats">
        {stats.map(([l, val, cls]) => <div className="stat" key={l}><span>{l}</span><b className={cls || ""}>{val}</b></div>)}
      </div>
      <div className="panel">
        <div className="toolbar">
          <select value={month} onChange={e => setMonth(e.target.value)} aria-label="Month">
            <option value="all">All months</option>
            {months.map(m => <option key={m} value={m}>{fmtMonth(m)}</option>)}
          </select>
          {c.kind === "advance" && <select value={who} onChange={e => setWho(e.target.value)} aria-label="Person">
            <option value="all">Edwin and Bombet</option><option>Edwin</option><option>Bombet</option>
          </select>}
          <input type="search" placeholder="Search" value={q} onChange={e => setQ(e.target.value)} aria-label="Search" />
          <span className="grow" />
          <button className="btn small" onClick={exportCsv} disabled={!shown.length}>Export CSV</button>
        </div>
        {shown.length === 0 ? (
          <div className="empty">{rows.length ? "No entries match these filters." : canEdit ? "No entries yet. Use “Add entry” to record the first one." : "No entries yet."}</div>
        ) : (
          <div className="tablewrap">
            <table className="resp">
              <thead><tr>{cols.map(col => <th key={col.h} className={col.r ? "r" : ""}>{col.h}</th>)}{canEdit && <th />}</tr></thead>
              <tbody>
                {shown.map(e => (
                  <tr key={e.id}>
                    {cols.map(col => <td key={col.h} data-l={col.h} className={col.r ? "r" : ""}>{col.cell(e)}</td>)}
                    {canEdit && <td className="act">
                      <button className="btn small" onClick={() => setEditing(e)}>Edit</button>
                      {canDelete && <button className="btn small danger" onClick={() => del(e)}>Delete</button>}
                    </td>}
                  </tr>
                ))}
              </tbody>
              <tfoot><tr>
                {cols.map((col, i) => <td key={col.h} data-l={col.tot ? "Total " + col.h : ""} className={col.r ? "r" : ""}>
                  {i === 0 ? `Total (${shown.length})` : col.tot ? (col.raw ? sum(shown, col.tot).toLocaleString("en-PH") : peso(sum(shown, col.tot))) : ""}
                </td>)}
                {canEdit && <td />}
              </tr></tfoot>
            </table>
          </div>
        )}
      </div>
      {editing && <EntryForm cat={cat} entry={editing === "new" ? null : editing}
        outstanding={c.kind === "labor" ? outstandingOf(c.person, entries) : 0}
        onClose={() => setEditing(null)} onSave={onSave} />}
    </>
  );
}

/* ---------- dashboard ---------- */
function Dashboard({ entries, go }) {
  const cur = today().slice(0, 7);
  const months = [...new Set([cur, ...entries.map(monthOf).filter(Boolean)])].sort().reverse();
  const [m, setM] = useState(cur);
  const onHand = sum(entries, cashIn) - sum(entries, cashOut);
  const inMonth = entries.filter(e => monthOf(e) === m);
  const outE = outstandingOf("Edwin", entries), outB = outstandingOf("Bombet", entries);
  const unpaid = entries.filter(e => CATS[e.category]?.kind === "bill" && !e.entry_date);
  const spendCats = ["edwin", "bombet", "maintenance", "pelco", "bwsi", "advance"];
  const by = spendCats.map(k => [k, sum(inMonth.filter(e => e.category === k), gross)]);
  const max = Math.max(1, ...by.map(x => x[1]));
  const recent = [...entries].sort((a, b) => (b.created_at || "").localeCompare(a.created_at || "")).slice(0, 8);

  return (
    <>
      <div className="top">
        <div><h2>Dashboard</h2><p>Where the house fund stands right now.</p></div>
        <select value={m} onChange={e => setM(e.target.value)} aria-label="Month" style={{ width: "auto" }}>
          {months.map(x => <option key={x} value={x}>{fmtMonth(x)}</option>)}
        </select>
      </div>
      <div className="stats">
        <div className="stat hero"><span>Cash on hand</span><b>{peso(onHand)}</b></div>
        <div className="stat"><span>Received in {fmtMonth(m)}</span><b className="in">{peso(sum(inMonth, cashIn))}</b></div>
        <div className="stat"><span>Paid out in {fmtMonth(m)}</span><b className="out">{peso(sum(inMonth, cashOut))}</b></div>
        <div className="stat"><span>Unpaid bills</span><b className={unpaid.length ? "out" : ""}>{unpaid.length ? `${unpaid.length} · ${peso(sum(unpaid, gross))}` : "None"}</b></div>
        <div className="stat"><span>Edwin's outstanding CA</span><b>{peso(outE)}</b></div>
        <div className="stat"><span>Bombet's outstanding CA</span><b>{peso(outB)}</b></div>
      </div>
      <div className="panel">
        <h3>Spending in {fmtMonth(m)}</h3>
        <div className="bars">
          {by.map(([k, v]) => (
            <button className="bar" key={k} onClick={() => go(k)}>
              <span>{CATS[k].label.split(" – ")[0]}</span>
              <span className="track"><span className="fill" style={{ width: `${(v / max) * 100}%`, background: CATS[k].color, display: "block" }} /></span>
              <span className="amt">{peso(v)}</span>
            </button>
          ))}
        </div>
      </div>
      <div className="panel">
        <h3>Latest entries</h3>
        {recent.length === 0 ? <div className="empty">Nothing recorded yet. Start with Cash Received to set up the fund.</div> :
          <div className="tablewrap"><table className="resp">
            <thead><tr><th>Section</th><th>Details</th><th>Added by</th><th className="r">Amount</th></tr></thead>
            <tbody>{recent.map(e => (
              <tr key={e.id}>
                <td data-l="Section"><span className="dot" style={{ background: CATS[e.category]?.color, display: "inline-block", marginRight: 8 }} />{CATS[e.category]?.label}</td>
                <td data-l="Details">{summaryOf(e)}</td>
                <td data-l="Added by">{e.created_by || "—"}</td>
                <td data-l="Amount" className={"r " + (e.category === "received" ? "in" : "")}>{peso(gross(e))}</td>
              </tr>))}</tbody>
          </table></div>}
      </div>
    </>
  );
}

/* ---------- admin ---------- */
function AdminView({ users, me, entries, onAddUser, onSetRole, onResetPw, onDeleteUser }) {
  const [f, setF] = useState({ full_name: "", username: "", password: "", role: "viewer" });
  const [err, setErr] = useState(""); const [msg, setMsg] = useState(""); const [busy, setBusy] = useState(false);
  const [pwFor, setPwFor] = useState(null);
  const add = async () => {
    setErr(""); setMsg("");
    if (!f.username.trim() || !f.password) return setErr("Username and password are required.");
    if (!/^[a-z0-9._-]{3,}$/i.test(f.username.trim())) return setErr("Username needs at least 3 letters or numbers, no spaces.");
    if (f.password.length < 4) return setErr("Password needs at least 4 characters.");
    if (users.some(u => u.username === f.username.trim().toLowerCase())) return setErr("That username is already taken.");
    setBusy(true);
    try { await onAddUser(f); setMsg(`User “${f.username.trim().toLowerCase()}” created.`); setF({ full_name: "", username: "", password: "", role: "viewer" }); }
    catch (e) { setErr("Could not create user: " + e.message); }
    setBusy(false);
  };
  const exportAll = () => {
    const keys = ["category", "entry_date", "billing_month", "due_date", "person", "description", "amount", "convenience_fee", "ca_deducted", "reading", "or_number", "mode", "reference", "remarks", "created_by", "created_at", "updated_by", "updated_at"];
    downloadCSV("mercado-house-ledger-all.csv", [keys, ...entries.map(e => keys.map(k => k === "category" ? CATS[e.category]?.label : e[k]))]);
  };
  const sorted = [...users].sort((a, b) => a.username.localeCompare(b.username));
  return (
    <>
      <div className="top"><div><h2>Admin</h2><p>Create users and choose what each one can do.</p></div>
        <button className="btn small" onClick={exportAll} disabled={!entries.length}>Export all entries (CSV)</button></div>
      <div className="panel">
        <h3>Add a user</h3>
        <div className="form" style={{ padding: 16 }}>
          <div className="row2" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 12 }}>
            <label>Full name<input value={f.full_name} onChange={e => setF({ ...f, full_name: e.target.value })} /></label>
            <label>Username <span className="req">*</span><input value={f.username} autoCapitalize="none" onChange={e => setF({ ...f, username: e.target.value })} /></label>
            <label>Password <span className="req">*</span><input type="password" value={f.password} onChange={e => setF({ ...f, password: e.target.value })} /></label>
            <label>Access<select value={f.role} onChange={e => setF({ ...f, role: e.target.value })}>
              <option value="viewer">View only</option><option value="editor">View and edit</option><option value="admin">Admin</option>
            </select></label>
          </div>
          <p className="hint" style={{ margin: 0 }}>View only: sees everything, changes nothing. View and edit: can add and edit entries. Admin: everything, including deleting entries and managing users.</p>
          {err && <p className="err" role="alert">{err}</p>}
          {msg && <p className="in" style={{ margin: 0 }}>{msg}</p>}
          <div><button className="btn primary" onClick={add} disabled={busy}>{busy ? "Creating…" : "Create user"}</button></div>
        </div>
      </div>
      <div className="panel">
        <h3>Users ({users.length})</h3>
        <div className="tablewrap"><table className="resp">
          <thead><tr><th>Name</th><th>Username</th><th>Access</th><th>Created</th><th /></tr></thead>
          <tbody>{sorted.map(u => (
            <tr key={u.id}>
              <td data-l="Name">{u.full_name || "—"}{u.id === me.id && <span className="sub"> (you)</span>}</td>
              <td data-l="Username">{u.username}</td>
              <td data-l="Access">
                {u.id === me.id ? ROLES[u.role] :
                  <select value={u.role} onChange={e => onSetRole(u, e.target.value).catch(x => alert(x.message))} style={{ width: "auto" }} aria-label={"Access for " + u.username}>
                    <option value="viewer">View only</option><option value="editor">View and edit</option><option value="admin">Admin</option>
                  </select>}
              </td>
              <td data-l="Created">{fmtWhen(u.created_at)}</td>
              <td className="act">
                <button className="btn small" onClick={() => setPwFor(u)}>Reset password</button>
                {u.id !== me.id && <button className="btn small danger" onClick={() => {
                  if (window.confirm(`Delete user “${u.username}”? They won't be able to sign in.`)) onDeleteUser(u).catch(x => alert(x.message));
                }}>Delete</button>}
              </td>
            </tr>))}</tbody>
        </table></div>
      </div>
      {pwFor && <PasswordModal title={`New password for ${pwFor.username}`} onClose={() => setPwFor(null)}
        onSave={pw => onResetPw(pwFor, pw)} />}
    </>
  );
}

function PasswordModal({ title, needCurrent, onSave, onClose }) {
  const [cur, setCur] = useState(""); const [pw, setPw] = useState(""); const [pw2, setPw2] = useState("");
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const save = async () => {
    if (pw.length < 4) return setErr("Password needs at least 4 characters.");
    if (pw !== pw2) return setErr("The two passwords don't match.");
    setBusy(true);
    try { await onSave(pw, cur); onClose(); } catch (e) { setErr(e.message); setBusy(false); }
  };
  return (
    <Modal title={title} onClose={onClose}>
      <div className="form">
        {needCurrent && <label>Current password<input type="password" value={cur} onChange={e => setCur(e.target.value)} /></label>}
        <label>New password<input type="password" value={pw} onChange={e => setPw(e.target.value)} /></label>
        <label>Confirm new password<input type="password" value={pw2} onChange={e => setPw2(e.target.value)} /></label>
        {err && <p className="err" role="alert">{err}</p>}
        <div className="actions"><button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={save} disabled={busy}>{busy ? "Saving…" : "Save password"}</button></div>
      </div>
    </Modal>
  );
}

/* ---------- login / first-run setup ---------- */
function Login({ users, onLogin, onSetup, loadErr }) {
  const setup = users.length === 0 && !loadErr;
  const [f, setF] = useState({ full_name: "", username: "", password: "", password2: "" });
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const go = async () => {
    setErr("");
    const un = f.username.trim().toLowerCase();
    if (!un || !f.password) return setErr("Enter your username and password.");
    setBusy(true);
    try {
      if (setup) {
        if (!/^[a-z0-9._-]{3,}$/.test(un)) throw new Error("Username needs at least 3 letters or numbers, no spaces.");
        if (f.password.length < 4) throw new Error("Password needs at least 4 characters.");
        if (f.password !== f.password2) throw new Error("The two passwords don't match.");
        await onSetup({ ...f, username: un });
      } else {
        const u = users.find(x => x.username === un);
        if (!u || u.password_hash !== await hashPw(un, f.password)) throw new Error("Wrong username or password.");
        onLogin(u);
      }
    } catch (e) { setErr(e.message); setBusy(false); }
  };
  const key = e => e.key === "Enter" && go();
  return (
    <div className="login">
      <div className="card" onKeyDown={key}>
        <h1>Mercado House Ledger</h1>
        <p>{setup ? "First time here. Create the admin account to get started." : "Sign in to view the house expenses."}</p>
        {loadErr && <p className="err" style={{ marginBottom: 12 }}>{loadErr}</p>}
        <div className="form">
          {setup && <label>Full name<input value={f.full_name} onChange={e => setF({ ...f, full_name: e.target.value })} /></label>}
          <label>Username<input value={f.username} autoCapitalize="none" autoComplete="username" onChange={e => setF({ ...f, username: e.target.value })} /></label>
          <label>Password<input type="password" autoComplete={setup ? "new-password" : "current-password"} value={f.password} onChange={e => setF({ ...f, password: e.target.value })} /></label>
          {setup && <label>Confirm password<input type="password" value={f.password2} onChange={e => setF({ ...f, password2: e.target.value })} /></label>}
          {err && <p className="err" role="alert">{err}</p>}
          <button className="btn primary" onClick={go} disabled={busy || !!loadErr}>{busy ? "Please wait…" : setup ? "Create admin account" : "Sign in"}</button>
        </div>
        {!CLOUD && <p className="hint" style={{ marginTop: 16, marginBottom: 0 }}>Local mode: data stays on this device until a Supabase key is added.</p>}
      </div>
    </div>
  );
}

/* ---------- app ---------- */
function App() {
  const [users, setUsers] = useState(null);
  const [entries, setEntries] = useState([]);
  const [history, setHistory] = useState([]);
  const [me, setMe] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [navOpen, setNavOpen] = useState(false);
  const [loadErr, setLoadErr] = useState("");
  const [pwOpen, setPwOpen] = useState(false);

  const loadAll = useCallback(async () => {
    try {
      const [u, e, h] = await Promise.all([db.list(T.users), db.list(T.entries), db.list(T.history)]);
      setUsers(u); setEntries(e); setHistory(h); setLoadErr(""); return u;
    } catch (x) {
      setLoadErr("Can't reach the database. Check the Supabase key and that the setup SQL has been run. (" + x.message + ")");
      setUsers(u => u || []); return null;
    }
  }, []);

  useEffect(() => {
    (async () => {
      const u = await loadAll();
      let sid = null; try { sid = sessionStorage.getItem("mhl_session"); } catch (e) {}
      const found = u && u.find(x => x.id === sid);
      if (found) setMe(found);
    })();
  }, []);
  useEffect(() => { if (me) loadAll(); }, [tab]);
  useEffect(() => {
    if (!me || !users) return;
    const f = users.find(u => u.id === me.id);
    if (!f) logout(); else if (f.role !== me.role) setMe(f);
  }, [users]);
  useEffect(() => { if (tab === "admin" && me && me.role !== "admin") setTab("dashboard"); }, [me, tab]);

  const login = u => { try { sessionStorage.setItem("mhl_session", u.id); } catch (e) {} setMe(u); setTab("dashboard"); };
  function logout() { try { sessionStorage.removeItem("mhl_session"); } catch (e) {} setMe(null); }

  const log = async (action, category, summary, amount, who) => {
    try {
      const h = await db.insert(T.history, { action, category, summary, amount: amount ?? null, username: who || me.username });
      setHistory(p => [...p, h]);
    } catch (e) {}
  };

  const saveEntry = async (row, existing) => {
    if (existing) {
      const fs = fieldsFor(existing.category);
      const changes = fs.filter(f => !same(f, existing[f.k], row[f.k])).map(f => `${f.l}: ${fmtVal(f, existing[f.k])} → ${fmtVal(f, row[f.k])}`);
      const r = await db.update(T.entries, existing.id, { ...row, updated_by: me.username, updated_at: new Date().toISOString() });
      setEntries(p => p.map(x => x.id === r.id ? r : x));
      await log("Edited", r.category, `${summaryOf(r)}${changes.length ? " | " + changes.join("; ") : ""}`, gross(r));
    } else {
      const r = await db.insert(T.entries, { ...row, created_by: me.username });
      setEntries(p => [...p, r]);
      await log("Added", r.category, summaryOf(r), gross(r));
    }
  };
  const deleteEntry = async e => {
    await db.remove(T.entries, e.id);
    setEntries(p => p.filter(x => x.id !== e.id));
    await log("Deleted", e.category, `${summaryOf(e)} (dated ${fmtDate(e.entry_date || (e.billing_month ? e.billing_month + "-01" : ""))})`, gross(e));
  };

  const admins = () => users.filter(u => u.role === "admin").length;
  const addUser = async f => {
    const un = f.username.trim().toLowerCase();
    const u = await db.insert(T.users, { username: un, full_name: f.full_name.trim() || null, role: f.role, password_hash: await hashPw(un, f.password) });
    setUsers(p => [...p, u]);
    await log("Added", "users", `User ${un} – ${ROLES[f.role]}`);
  };
  const setupAdmin = async f => {
    const u = await db.insert(T.users, { username: f.username, full_name: f.full_name.trim() || null, role: "admin", password_hash: await hashPw(f.username, f.password) });
    setUsers([u]);
    try { await db.insert(T.history, { action: "Added", category: "users", summary: `Admin account ${u.username} created`, username: u.username }); } catch (e) {}
    login(u);
  };
  const setRole = async (u, role) => {
    if (u.role === "admin" && role !== "admin" && admins() <= 1) throw new Error("There must be at least one admin.");
    const r = await db.update(T.users, u.id, { role });
    setUsers(p => p.map(x => x.id === r.id ? r : x));
    await log("Edited", "users", `User ${u.username}: ${ROLES[u.role]} → ${ROLES[role]}`);
  };
  const resetPw = async (u, pw) => {
    const r = await db.update(T.users, u.id, { password_hash: await hashPw(u.username, pw) });
    setUsers(p => p.map(x => x.id === r.id ? r : x));
    await log("Edited", "users", `Password reset for ${u.username}`);
  };
  const changeOwnPw = async (pw, cur) => {
    if (me.password_hash !== await hashPw(me.username, cur)) throw new Error("Current password is wrong.");
    const r = await db.update(T.users, me.id, { password_hash: await hashPw(me.username, pw) });
    setUsers(p => p.map(x => x.id === r.id ? r : x)); setMe(r);
    await log("Edited", "users", `${me.username} changed their password`);
  };
  const deleteUser = async u => {
    if (u.role === "admin" && admins() <= 1) throw new Error("There must be at least one admin.");
    await db.remove(T.users, u.id);
    setUsers(p => p.filter(x => x.id !== u.id));
    await log("Deleted", "users", `User ${u.username} (${ROLES[u.role]})`);
  };

  if (users === null) return <div className="login"><p style={{ color: "#fff" }}>Loading…</p></div>;
  if (!me) return <Login users={users} loadErr={loadErr} onLogin={login} onSetup={setupAdmin} />;

  const onHand = sum(entries, cashIn) - sum(entries, cashOut);
  const nav = [["dashboard", "Dashboard", "#E4EDE6"], ...ORDER.map(k => [k, CATS[k].label, CATS[k].color]), "sep",
    ["history", "History", "#9FB3A7"], ...(me.role === "admin" ? [["admin", "Admin", "#9FB3A7"]] : [])];
  const title = tab === "dashboard" ? "Dashboard" : tab === "history" ? "History" : tab === "admin" ? "Admin" : CATS[tab].label;
  const go = k => { setTab(k); setNavOpen(false); window.scrollTo(0, 0); };

  return (
    <div className="app">
      <aside className={"side" + (navOpen ? " open" : "")} aria-label="Menu">
        <div className="brand"><h1>Mercado House Ledger</h1><small>House maintenance and bills</small></div>
        <nav className="nav">
          {nav.map((n, i) => n === "sep" ? <div className="sep" key={"s" + i} /> :
            <button key={n[0]} className={tab === n[0] ? "on" : ""} aria-current={tab === n[0] ? "page" : undefined} onClick={() => go(n[0])}>
              <span className="dot" style={{ background: n[2] }} />{n[1]}
            </button>)}
        </nav>
        <div className="cashbox"><span>Cash on hand</span><b className={onHand < 0 ? "neg" : ""}>{peso(onHand)}</b></div>
        <div className="who">
          <strong>{me.full_name || me.username}</strong>{ROLES[me.role]}
          <div className="links"><button className="linkbtn" onClick={() => setPwOpen(true)}>Change password</button>
            <button className="linkbtn" onClick={logout}>Sign out</button></div>
        </div>
      </aside>
      <div className={"scrim" + (navOpen ? " show" : "")} onClick={() => setNavOpen(false)} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div className="mobilebar">
          <button className="menu" aria-label="Open menu" onClick={() => setNavOpen(true)}>☰</button>
          <b>{title}</b><span className="num">{peso(onHand)}</span>
        </div>
        <main className="main">
          {!CLOUD && <div className="banner">Local mode: entries are saved only in this browser. Paste the Supabase anon key at the top of index.html so everyone shares the same data.</div>}
          {loadErr && <div className="banner">{loadErr}</div>}
          {tab === "dashboard" && <Dashboard entries={entries} go={go} />}
          {CATS[tab] && <SectionView key={tab} cat={tab} entries={entries} me={me} onSave={saveEntry} onDelete={deleteEntry} />}
          {tab === "history" && <HistoryView history={history} users={users} />}
          {tab === "admin" && me.role === "admin" && <AdminView users={users} me={me} entries={entries}
            onAddUser={addUser} onSetRole={setRole} onResetPw={resetPw} onDeleteUser={deleteUser} />}
        </main>
      </div>
      {pwOpen && <PasswordModal title="Change your password" needCurrent onSave={changeOwnPw} onClose={() => setPwOpen(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
